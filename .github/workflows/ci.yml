name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

    # NOTE: the example tests in `npm test` are mock-based (fake providers,
    # in-memory/fake session stores, fake browser globals) so they run on a
    # clean CI runner with no live services or real credentials. A few tests
    # use native modules (better-sqlite3) pulled in via devDependencies; those
    # are installed by `npm ci` and have prebuilt binaries for the runner arch.

